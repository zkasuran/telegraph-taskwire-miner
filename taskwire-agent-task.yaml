version: "1"
kind: miner
id: 7426
slug: taskwire-agent-task
protocol: generic
name: TaskWire Agent Task
description: >
  Agent task planning for a described multi-step task, answered by a language model at request
  time. Send the task or the whole question and the miner returns the concrete plan an agent
  should follow to carry it out end to end, leading with the first action then the ordered steps
  through preparation, the main work, checking each result and a verified outcome. The answer is
  produced with MiniMax under a commercial plan held by the operator, so this miner is not
  keyless. Serves the AGENT_TASK intent.
base_url: https://telegraph-task.margyn.workers.dev

docs:
  documentation: https://telegraph-task.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: task is the task to plan or the whole question. A single task, not a batch.
    param: task
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example 'Describe how an agent should
        handle a multi-step customer refund request end to end.'. The miner reads the task from
        it, so passing the whole question works as well as passing the task on its own.
    task:
      type: string
      description: The task to plan, if supplied on its own.
    goal:
      type: string
      description: The goal to plan for, an alternative name for the task.

output_schema:
  type: object
  properties:
    headline:
      type: string
      description: The first sentence of the plan, a short label for a reader.
    summary:
      type: string
      description: The end-to-end plan the agent should follow to carry out the task.
    confidence:
      type: number
      description: 0.95 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /agent-task
    external_path: /agent-task
    method: GET
    description: >
      Plan one task, the task as a query parameter (?task=...). Also accepts a whole question in
      ?question= or ?query= or the goal in ?goal=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - AGENT_TASK

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: headline
        description: The first sentence of the plan.
        source_path: headline
      - index: 1
        name: summary
        description: The end-to-end plan for the task.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: agent-task
      method: GET
      query_params:
        task: { source: strings.1 }
